<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'">
<title>DiffWeb</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #FBF7F0; font-family: "Segoe UI", Inter, system-ui, sans-serif; color: #5B5670; }
  img { width: 84px; height: 84px; border-radius: 22px; box-shadow: 0 14px 34px -14px rgba(79,70,229,.55); animation: pop .35s ease-out; }
  .dots { display: flex; gap: 6px; } .dots i { width: 7px; height: 7px; border-radius: 50%; background: #4f46e5; opacity: .25; animation: blink 1.1s infinite; }
  .dots i:nth-child(2) { animation-delay: .18s; } .dots i:nth-child(3) { animation-delay: .36s; }
  @keyframes blink { 40% { opacity: 1; } }
  @keyframes pop { from { transform: scale(.9); opacity: 0; } }
  @media (prefers-color-scheme: dark) { body { background: #0B0B0C; } }
</style>
</head>
<body>
  <img src="icon.png" alt="DiffWeb">
  <div class="dots" aria-label="Opening"><i></i><i></i><i></i></div>
</body>
</html>
