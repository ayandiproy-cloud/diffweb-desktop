name: Build Windows app

# Runs when you push to main, or press "Run workflow" on the Actions tab.
# Every build gets a new version (1.0.<build number>) and is published as a GitHub Release.
# Installed apps find it there and update themselves.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install
      - name: Set the version for this build
        run: npm version 1.0.${{ github.run_number }} --no-git-tag-version
      - name: Build the installer and publish the release
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save the installer
        uses: actions/upload-artifact@v4
        with:
          name: DiffWeb-Setup
          path: dist/*.exe
